[project]
name = "argus-agent"
version = "0.1.0"
description = "ARGUS — Autonomous Urban Heat Intelligence System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pymongo>=4.8.0",
    "openai>=1.45.0",
    "shapely>=2.0.6",
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
